name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feat/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
        # Expanded to include the new GPU Orchestrator service
        service: [fastapi_backend, etl_service, gpu_ops_alpha_orchestrator]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Java for Analytics
        if: hashFiles(format('{0}/pom.xml', matrix.service)) != ''
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install dependencies
        working-directory: ./${{ matrix.service }}
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run Polyglot Tests
        working-directory: ./${{ matrix.service }}
        run: pytest --cov --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}
      - name: Cleanup
        if: always()
        run: docker compose down

  test-kotlin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./kotlin-data-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('kotlin-data-agent/build.gradle.kts') }}
      - name: Run Kotlin tests
        run: gradle test --no-daemon

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linting Tools
        run: pip install ruff yamllint
      - name: Lint Python with ruff
        run: ruff check .
      - name: Validate Agent Skills (Frontmatter)
        # Enforces metadata standards for AI-augmented enterprise SDLC
        run: |
          for f in $(find . -name "SKILL.md"); do
            echo "Validating Agent Skill Metadata: $f"
            sed -n '/^---$/,/^---$/p' "$f" | sed '1d;$d' > temp.yaml
            yamllint temp.yaml
          done

  docker:
    runs-on: ubuntu-latest
    needs: [test, test-kotlin, lint]
    # Enabled for feature branches to validate GPU infrastructure changes
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feat/')
    steps:
      - uses: actions/checkout@v4
      
      - name: Build H100-Optimized Services
        run: docker compose build

      - name: Run GPU-Accelerated Integration Tests
        env:
          # --- Core Infrastructure Defaults ---
          DB_USER: postgres
          DB_PASS: postgres
          DB_NAME: investment_analysis
          FMP_API_KEY: ""

          # --- Astra DB + Nvidia NIM (H100 Tensor Core Context) ---
          # Accessing nv-embedqa-e5-v5 via DataStax/GCP
          ASTRA_DB_APPLICATION_TOKEN: ${{ secrets.ASTRA_DB_TOKEN }}
          ASTRA_DB_API_ENDPOINT: ${{ vars.ASTRA_DB_ENDPOINT }}
          ASTRA_DB_KEYSPACE: "alpha_signals"
          
          # Compute signaling for LLM/Agentic routing
          EMBEDDING_MODEL_ID: "nvidia/nv-embedqa-e5-v5" 
          VECTOR_COMPUTE_HARDWARE: "h100-tensor-core"
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: "us-central1"

        run: |
          docker compose up -d
          echo "Waiting 20s for CUDA/Triton inference warm-up..."
          sleep 20 
          
          # Standard Service Checks
          curl -f http://localhost:8000/health
          curl -f http://localhost:8090/health
          
          # NEW: GPU Orchestrator Health & Metric Check
          curl -f http://localhost:8070/health/gpu-status

      - name: Dump compute logs (on failure)
        if: failure()
        run: |
          docker compose ps
          echo "---- gpu_ops_alpha_orchestrator logs ----"
          docker compose logs --no-color gpu_ops_alpha_orchestrator || true
          docker compose config

      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans
